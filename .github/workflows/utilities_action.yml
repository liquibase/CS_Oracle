####################################################################
#  GitHub Action to perform various Liquibase utilities.
#####################################################################
name: 'Liquibase Secure Utilities'
run-name: ${{ inputs.environment}} utilities by ${{ github.actor }}

on:
  workflow_dispatch:
    # Following are the inputs received via the GitHubActions Run workflow dialog
    inputs:
      # The type 'environment' will automatically pull in the environments created in GitHub
      environment:
        description: 'Environment'
        type: environment
        required: true     

      utility:
        description: 'Utility to run'
        type: choice
        required: true
        options:
        - changelog-sync
        - connect
        - generate-changelog-zip
        - history
        - release-locks
        - snapshot
        - status
       
####################################################################
#  Set up the environment
#####################################################################
env:  
  # AWS S3 bucket is the host part of the S3 bucket
  AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
  
  # AWS Access credentials use by the Liquibase Pro S3 Extension
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  
  # Secure License key
  # LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}
  LIQUIBASE_LICENSE_FILE: ${{ github.workspace }}/license.lic
  
  # JDBC URL of the database per environment
  # See https://docs.liquibase.com/workflows/liquibase-community/using-jdbc-url-in-liquibase.html
  LIQUIBASE_COMMAND_URL: ${{ vars.LIQUIBASE_URL }}

  # Credentials for the environment's database https://docs.liquibase.com/parameters/command-parameters.html
  LIQUIBASE_COMMAND_USERNAME: ${{ secrets.LIQUIBASE_USERNAME }}
  LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.LIQUIBASE_PASSWORD }}

  # Liquibase schema: Specified to allow flexibility in storage of Liquibase Change Tracking Tables
  # See https://docs.liquibase.com/parameters/liquibase-schema-name.html
  LIQUIBASE_LIQUIBASE_SCHEMA_NAME: MUREX
  
  # Default schema: Specify schema for all changes
  LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: MUREX
  LIQUIBASE_COMMAND_REFERENCE_DEFAULT_SCHEMA_NAME: MUREX

  # Search path (See https://docs.liquibase.com/concepts/changelogs/how-liquibase-finds-files.html)
  LIQUIBASE_SEARCH_PATH: flows,checks,changelogs

  # The database changelog. See https://docs.liquibase.com/concepts/changelogs/working-with-changelogs.html
  LIQUIBASE_COMMAND_CHANGELOG_FILE: rootchangelog.yaml
  
  ENVIRONMENT: ${{ inputs.environment }}
  LB_UTILITY: ${{ inputs.utility }}
  
  # Drift Detection
  LB_SCHEMAS: "MUREX"
  
  # Values: OFF, SEVERE, WARNING, INFO, FINE
  LIQUIBASE_LOG_LEVEL: INFO
  LIQUIBASE_LOG_FORMAT: JSON_PRETTY
  LIQUIBASE_LOG_FILE: logs/log.json

  # History Table
  LIQUIBASE_DBCLHISTORY_ENABLED: true

jobs:
  #########################################################################
  #  Run Utilities
  #########################################################################

  database-utilities:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1
  
    - name: Get Liquibase license secret
      id: license-secret
      uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
      with:
        secret-ids: |
          LB_LICENSE, asmith_oracle
        parse-json-secrets: true

    - name: Setup Liquibase License
      uses: ./.github/workflows/setup-liquibase-license
      with:
      #  license-b64: ${{ secrets.LIQUIBASE_LICENSE_FILE_B64 }}
      #  license-path: ${{ env.LIQUIBASE_LICENSE_FILE }}
        license-b64: ${{ env.LB_LICENSE_LICENSE_FILE_B64 }}
        license-path: ${{ env.LIQUIBASE_LICENSE_FILE }}

    - name: Setup Liquibase Environment
      uses: ./.github/workflows/setup-liquibase
 
    - name: Liquibase Utilities Flow
      run: liquibase flow --flow-file=liquibase-utilities.flowfile.yaml
        
    - name: Upload Generate Changelog Artifact
      if: github.event.inputs.utility == 'generate-changelog-zip'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.environment }}-changelog.oracle.zip
        path: generatechangelogs
        
    - name: Upload Snapshot Artifact
      if: github.event.inputs.utility == 'snapshot-zip'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.environment }}-snapshot.zip
        path: snapshots
