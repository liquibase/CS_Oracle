#############################################################################
#  GitHub Action to perform a rollback for selected environment.
##############################################################################
name: 'Liquibase Secure Rollback'
run-name: ${{ inputs.environment}} rollback of current repo by ${{ github.actor }}

on:
  workflow_dispatch:
    # Following are the inputs received via the GitHubActions Run workflow dialog
    inputs:

      # The type 'environment' will automatically pull in the environments created in GitHub
      environment:
        description: 'Environment for rollback'
        type: environment
        required: true
        default: QA
        
      rollback_type:
        type: choice
        description: "Rollback type"
        required: true
        options:
          - rollback_one_changeset
          - rollback_to_tag        

      # Changeset fields (only used if rollback_type == rollback_one_changeset)
      changeset_id:
        description: "Changeset ID (for rollback_one_changeset)"
        required: false
      changeset_author:
        description: "Author (for rollback_one_changeset)"
        required: false
      changeset_path:
        description: "Path (for rollback_one_changeset)"
        required: false

      # Tag field (only used if rollback_type == rollback_to_tag)
      lb_tag:
        description: "Tag (for rollback_to_tag)"
        type: string
        required: false

####################################################################
#  Set up the environment
#####################################################################
env:
  # AWS S3 bucket is the host part of the S3 bucket
  AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
  
  # AWS Access credentials use by the Liquibase Pro S3 Extension
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  # Pro License key
  # See https://docs.liquibase.com/workflows/liquibase-pro/how-to-apply-your-liquibase-pro-license-key.html
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }} 

  # JDBC URL of the database per environment
  # See https://docs.liquibase.com/workflows/liquibase-community/using-jdbc-url-in-liquibase.html
  LIQUIBASE_COMMAND_URL: ${{ vars.LIQUIBASE_URL }}

  # Credentials for the environment's database https://docs.liquibase.com/parameters/command-parameters.html
  LIQUIBASE_COMMAND_USERNAME: ${{ secrets.LIQUIBASE_USERNAME }}
  LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.LIQUIBASE_PASSWORD }}

  # Liquibase schema: Specified to allow flexibility in storage of Liquibase Change Tracking Tables
  # See https://docs.liquibase.com/parameters/liquibase-schema-name.html
  LIQUIBASE_LIQUIBASE_SCHEMA_NAME: "MUREX"

  # Default schema: Specify schema for all changes
  LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: MUREX
  LIQUIBASE_COMMAND_REFERENCE_DEFAULT_SCHEMA_NAME: MUREX

  # Search path (See https://docs.liquibase.com/concepts/changelogs/how-liquibase-finds-files.html)
  LIQUIBASE_SEARCH_PATH: flows,checks,changelogs

  # The database changelog. See https://docs.liquibase.com/concepts/changelogs/working-with-changelogs.html
  LIQUIBASE_COMMAND_CHANGELOG_FILE: rootchangelog.yaml

  ENVIRONMENT: ${{ inputs.environment }}
  BRANCH: ${{ github.ref_name }}

  # Rollback
  ROLLBACK_TYPE: ${{ inputs.rollback_type }}
  LB_TAG: ${{ inputs.lb_tag }}
  LB_CHANGESET_ID: ${{ inputs.changeset_id }}
  LB_CHANGESET_AUTHOR: ${{ inputs.changeset_author }}
  LB_CHANGESET_PATH: ${{ inputs.changeset_path }}

  # Reports
  LIQUIBASE_REPORT_PATH: reports
  
  # Values: OFF, SEVERE, WARNING, INFO, FINE
  LIQUIBASE_LOG_LEVEL: INFO
  LIQUIBASE_LOG_FORMAT: JSON_PRETTY
  LIQUIBASE_LOG_FILE: logs/log.json

  # Drift Detection
  LB_SCHEMAS: "MUREX"
  
  # History Table
  LIQUIBASE_DBCLHISTORY_ENABLED: true

jobs:
  #########################################################################
  #  Validate inputs
  #########################################################################
  rollback_one_changeset:
    runs-on: [self-hosted]
    if: ${{ inputs.rollback_type == 'rollback_one_changeset' }}
    steps:
      - name: Validate required inputs
        run: |
          if [ -z "${{ inputs.changeset_id }}" ] || [ -z "${{ inputs.changeset_author }}" ] || [ -z "${{ inputs.changeset_path }}" ]; then
            echo "ERROR: changeset_id, changeset_author, and changeset_path are required for rollback_one_changeset"
            exit 1
          fi
      - name: Run changeset rollback
        run: |
          echo "Rolling back changeset ${{ inputs.changeset_id }} by ${{ inputs.changeset_author }} at ${{ inputs.changeset_path }}"

  rollback-to-tag:
    runs-on: [self-hosted]
    if: ${{ inputs.rollback_type == 'rollback_to_tag' }}
    steps:
      - name: Validate required inputs
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "ERROR: tag is required for rollback_to_tag"
            exit 1
          fi
      - name: Run tag rollback
        run: |
          echo "Rolling back to tag ${{ inputs.tag }}"


  #########################################################################
  #  Rollback
  #########################################################################
  database-rollback:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Liquibase Environment
      uses: ./.github/workflows/setup-liquibase
      
    - name: Liquibase Rollback Flow
      run: |
        liquibase flow --flow-file=liquibase-rollback.flowfile.yaml