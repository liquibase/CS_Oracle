#############################################################################
#  GitHub Action to perform a rollback for selected environment.
##############################################################################
name: 'Rollback Liquibase'
permissions:
  contents: write  
  actions: read

run-name: ${{ inputs.environment}} rollback of current repo by ${{ github.actor }}

on:

  workflow_dispatch:
    # Following are the inputs received via the GitHubActions Run workflow dialog
    inputs:

      # The type 'environment' will automatically pull in the environments created in GitHub
      environment:
        description: 'Environment for rollback'
        type: environment
        required: true
        default: QA

      lb_tag:
        description: 'Tag for rollback'
        type: string
        required: true

####################################################################
#  Set up the environment
#####################################################################
env:

  # Pro License key
  # See https://docs.liquibase.com/workflows/liquibase-pro/how-to-apply-your-liquibase-pro-license-key.html
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_PRO_LICENSE_KEY }} 

  # JDBC URL of the database per environment
  # See https://docs.liquibase.com/workflows/liquibase-community/using-jdbc-url-in-liquibase.html
  LIQUIBASE_COMMAND_URL: ${{ secrets.DATABASE_URL }}

  # Credentials for the environment's database https://docs.liquibase.com/parameters/command-parameters.html
  LIQUIBASE_COMMAND_USERNAME: ${{ secrets.DATABASE_USERNAME }}
  LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

  # Liquibase schema: Specified to allow flexibility in storage of Liquibase Change Tracking Tables
  # See https://docs.liquibase.com/parameters/liquibase-schema-name.html
  LIQUIBASE_LIQUIBASE_SCHEMA_NAME: Pricing

  # Default schema: Specify schema for all changes
  LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: Pricing
  # LIQUIBASE_COMMAND_REFERENCE_DEFAULT_SCHEMA_NAME: Sales

  # Search path (See https://docs.liquibase.com/concepts/changelogs/how-liquibase-finds-files.html)
  LIQUIBASE_SEARCH_PATH: liquibase-files, liquibase, snapshots

  # The database changelog. See https://docs.liquibase.com/concepts/changelogs/working-with-changelogs.html
  LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog.xml

  ENVIRONMENT: ${{ inputs.environment }}
  BRANCH: ${{ github.ref_name }}
  LB_TAG: ${{ github.event.inputs.lb_tag || github.ref_name }}

  LIQUIBASE_REPORT_PATH: reports
  # Values: OFF, SEVERE, WARNING, INFO, FINE
  LIQUIBASE_LOG_LEVEL: INFO
  LIQUIBASE_LOG_FORMAT: JSON_PRETTY
  LIQUIBASE_LOG_FILE: logs/log.json

  LB_SCHEMAS: "Pricing"
  LIQUIBASE_DBCLHISTORY_ENABLED: true

jobs:
  #########################################################################
  #  Build
  #########################################################################

  database-build:
    runs-on: sw-gh-ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
    - uses: sherwin-williams-co/sw-certificate-chain-action@v2

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.SA_DIGITALIT_DSS_TOKEN }}

    # Required for self-hosted runners
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - uses: liquibase/setup-liquibase@v1
      with:
        version: '4.33.0'
        edition: 'pro'

    - name: Liquibase Rollback Flow
      run: |
        liquibase flow --flow-file=liquibase-rollback.flowfile.yaml

    - uses: sherwin-williams-co/sw-generic-artifact-upload-artifactory-composite-action@main
      with:
        artifact_name: ${{ inputs.environment }}-snapshot.json
        artifactory_secret: ${{ secrets.JF_ARTIFACTORY_TOKEN }}
        artifact_path: ${{ github.workspace }}/snapshots
        artifactory_repo_name: 'sherwin-generic-local'
        artifactory_repo_subpath: 'cpm/pricingdb/snapshots'

    - name: Send mail
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        connection_url: "smtp:"
        server_address: smtp.sherwin.com
        server_port: 25
        secure: false
        subject: Github Actions job result
        to: alem.fredy@sherwin.com
        # Required sender full name (address can be skipped):
        from: tag-cpm-pricing@no-reply.sherwin.com # <user@example.com>
        # Optional plain body:
        body: |
          Build job of ${{github.repository}} completed successfully!
          This is a second line :)
        attachments: ./reports/*.html
        ignore_cert: true