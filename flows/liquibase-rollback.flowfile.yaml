##########           LIQUIBASE FLOWFILE                ##########
##########  learn more http://docs.liquibase.com/flow  ##########

## Note: Any command which fails in any stage below result in the command stopping, and endStage being run.
## A flow file can have one or more stages, each with multiple "actions", 
## or your flow file can have multiple stages with fewer actions in each stage.

globalVariables:
  TAG: ${LB_TAG}
  BUCKET: ${AWS_S3_BUCKET}
  ENV: ${ENVIRONMENT}
  SCHEMAS: ${LB_SCHEMAS}
  ROLLBACK_TYPE: ${ROLLBACK_TYPE}
  CHANGESET_ID: ${LB_CHANGESET_ID}
  CHANGESET_AUTHOR: ${LB_CHANGESET_AUTHOR}
  CHANGESET_PATH: ${LB_CHANGESET_PATH}

stages:
  Validation:
    actions:
    - type: liquibase
      command: validate

  Rollback-To-Tag-SQL:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_to_tag"
        command: rollback-sql
        cmdArgs: {tag: "${LB_TAG}"}
        globalArgs: { reports-name: "${ENV}-rollback-sql-report.html" }

  Rollback-To-Tag:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_to_tag"
        command: rollback
        cmdArgs: {tag: "${LB_TAG}"}
        globalArgs: { reports-name: "${ENV}-rollback-report.html"" }

  Rollback-One-Changeset-SQL:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_one_changeset"
        command: rollback-one-changeset-sql
        cmdArgs: { changeset-author: "${CHANGESET_AUTHOR}", changeset-id: "${CHANGESET_ID}", changeset-path: "${CHANGESET_PATH}" }
        globalArgs: { reports-name: "${ENV}-rollback-sql-report.html" }

  Rollback-One-Changeset:
    actions:
      - type: liquibase
        if: "${ROLLBACK_TYPE} == rollback_one_changeset"
        command: rollback-one-changeset
        cmdArgs: { changeset-author: "${CHANGESET_AUTHOR}", changeset-id: "${CHANGESET_ID}", changeset-path: "${CHANGESET_PATH}" }
        globalArgs: { reports-name: "${ENV}-rollback-report.html" }
  
  ## The endStage ALWAYS RUNS. 
  ## So put actions here which you desire to perform whether previous stages' actions succeed or fail.
  ## If you do not want any actions to ALWAYS RUN, simply delete the endStage from your flow file.

endStage:
  actions:
  - type: liquibase
    command: history

  - type: liquibase
    command: snapshot
    cmdArgs: {  snapshot-format: json, schemas: "${SCHEMAS}"}
    globalArgs: { output-file: 's3://${BUCKET}/oracleSnapshots/${ENV}-snapshot.json' }
        
  - type: shell
    command: echo 'Updated snapshot saved to s3://${BUCKET}/oracleSnapshots/${ENV}-snapshot.json'