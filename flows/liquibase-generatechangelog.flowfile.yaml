##########           LIQUIBASE FLOWFILE                ##########
##########  learn more http://docs.liquibase.com/flow  ##########

globalVariables:
  ENV: ${ENVIRONMENT}
  BUCKET: ${AWS_S3_BUCKET}
  SCHEMAS: ${LB_SCHEMAS}

stages:
  GenerateChangeLog:
    actions:
      - type: liquibase
        command: generatechangelog
        cmdArgs: {  snapshot-format: json, schemas: "${SCHEMAS}"}
        globalArgs: { output-file: 's3://${BUCKET}/oracleChangelogs/${ENV}-changelog.json' }
        
      - type: shell
        command: echo 'GenerateChangelog saved to s3://${BUCKET}/oracleChangelogs/${ENV}-changelog.json'