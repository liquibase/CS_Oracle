databaseChangeLog:

- changeSet:
    id: data_dml_test
    author: asmith
    runWith: sqlplus
    changes:
    - sqlFile:
        path: data_dml_01.sql
        relativeToChangelogFile: true
    - rollback:
        - sqlFile:
            path: data_dml_01-rollback.sql
            relativeToChangelogFile: true

- changeSet:
    id: data_dml_test2
    author: asmith
    runWith: sqlplus
    changes:
    - sqlFile:
        path: data_dml_02.sql
        relativeToChangelogFile: true
    - rollback:
        - sqlFile:
            path: data_dml_02-rollback.sql
            relativeToChangelogFile: true

- changeSet:
    id: data_dml_test3
    author: asmith
    runWith: sqlplus
    changes:
    - sqlFile:
        path: data_dml_03.sql
        relativeToChangelogFile: true
    - rollback:
        - sqlFile:
            path: data_dml_03-rollback.sql
            relativeToChangelogFile: true

- modifyChangeSets:
    runWith: sqlplus
    includeAll:
      path: scripts
      context: DEV
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: true

