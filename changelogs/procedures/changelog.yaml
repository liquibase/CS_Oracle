databaseChangeLog:

- changeSet:
    id: procedure1
    author: asmith
    changes:
    - sqlFile:
        path: procedure1.sql
        relativeToChangelogFile: true
        endDelimiter: /
    - rollback:
        - sqlFile:
            path: procedure1-rollback.sql
            relativeToChangelogFile: true
            
- changeSet:
    id: main_proc
    author: asmith
    runWith: sqlplus
    runOnChange: true
    runAlways: true
    ignore: true
    changes:
    - sqlFile:
        path: main_proc.sql
        relativeToChangelogFile: true
        endDelimiter: /

